<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Countdown until Cutie McCuteface comes to Stuggi &#9829;</title>
<style>
  :root {
    --bg1: #0f172a;
    --bg2: #1e293b;
    --card: rgba(255,255,255,0.07);
    --text: #f8fafc;
    --muted: #94a3b8;
    --accent: #38bdf8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center;
  }
  h1 {
    font-size: clamp(1.2rem, 4vw, 2rem);
    font-weight: 600;
    margin: 0 0 8px;
  }
  .target {
    color: var(--muted);
    font-size: clamp(0.85rem, 2.5vw, 1.05rem);
    margin-bottom: 32px;
  }
  .timer {
    display: flex;
    flex-wrap: wrap;
    gap: clamp(8px, 2vw, 20px);
    justify-content: center;
  }
  .unit {
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: clamp(12px, 3vw, 28px) clamp(14px, 3vw, 32px);
    min-width: clamp(78px, 17vw, 150px);
  }
  .num {
    font-size: clamp(2rem, 8vw, 4.5rem);
    font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }
  .label {
    margin-top: 6px;
    font-size: clamp(0.7rem, 2vw, 1rem);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
  }
  .done {
    font-size: clamp(1.8rem, 7vw, 4rem);
    font-weight: 700;
    color: var(--accent);
  }
</style>
</head>
<body>
  <h1 id="title">Countdown</h1>
  <div class="target" id="target"></div>
  <div class="timer" id="timer">
    <div class="unit"><div class="num" id="weeks">0</div><div class="label">Weeks</div></div>
    <div class="unit"><div class="num" id="days">0</div><div class="label">Days</div></div>
    <div class="unit"><div class="num" id="hours">00</div><div class="label">Hours</div></div>
    <div class="unit"><div class="num" id="minutes">00</div><div class="label">Minutes</div></div>
    <div class="unit"><div class="num" id="seconds">00</div><div class="label">Seconds</div></div>
  </div>

<script>
  // Target: 21 December 2026, 09:50 in Germany (CET = UTC+1, so 08:50 UTC).
  // Fixed to one moment in time, so everyone sees the same countdown
  // regardless of the time zone of their phone or PC.
  var TARGET = Date.UTC(2026, 11, 21, 8, 50, 0);

  document.getElementById("title").textContent = "Countdown until Cutie McCuteface comes to Stuggi \u2665";
  // Show the target in CET and, if the device is in another time zone,
  // also in the viewer's own local time (detected automatically).
  (function () {
    var line = "09:50 Central European Time";
    try {
      var userTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
      var d = new Date(TARGET);
      var cet = d.toLocaleString([], { timeZone: "Europe/Berlin", hour: "2-digit", minute: "2-digit", hour12: false });
      var local = d.toLocaleString([], { weekday: "short", day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
      var localTime = d.toLocaleString([], { hour: "2-digit", minute: "2-digit", hour12: false });
      if (userTz && userTz !== "Europe/Berlin" && localTime !== cet) {
        line += "<br>Your local time (" + userTz + "): " + local;
      }
    } catch (e) { /* older browser: just show the CET line */ }
    document.getElementById("target").innerHTML = line;
  })();

  function pad(n) { return n < 10 ? "0" + n : String(n); }

  function tick() {
    var diff = TARGET - Date.now();

    if (diff <= 0) {
      document.getElementById("timer").innerHTML = '<div class="done">It\'s time! 🎉</div>';
      clearInterval(interval);
      return;
    }

    var totalSeconds = Math.floor(diff / 1000);
    var weeks   = Math.floor(totalSeconds / (7 * 86400));
    var days    = Math.floor((totalSeconds % (7 * 86400)) / 86400);
    var hours   = Math.floor((totalSeconds % 86400) / 3600);
    var minutes = Math.floor((totalSeconds % 3600) / 60);
    var seconds = totalSeconds % 60;

    document.getElementById("weeks").textContent   = weeks;
    document.getElementById("days").textContent    = days;
    document.getElementById("hours").textContent   = pad(hours);
    document.getElementById("minutes").textContent = pad(minutes);
    document.getElementById("seconds").textContent = pad(seconds);
  }

  tick();
  var interval = setInterval(tick, 1000);
</script>
</body>
</html>
